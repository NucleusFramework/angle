version: 2

# Only the harness is ours. The ANGLE sources on main and the chromium/NNNN
# branches are untouched mirrors of upstream and must stay that way, so nothing
# here may propose changes to them -- Dependabot only sees .github and
# publishing/, neither of which exists upstream.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The publishing project: one plugin, kept in step with Nucleus' own catalog.
  - package-ecosystem: gradle
    directory: /publishing
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
