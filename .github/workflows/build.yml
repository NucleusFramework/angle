name: Build

# Builds the trimmed ANGLE runtime DLLs that Nucleus' Tao Windows backend ships.
#
# Two checkouts: the ANGLE source at the release branch being built, and the
# harness (.github/nucleus) from the default branch. Keeping them apart is what
# lets the release branch stay a clean mirror of upstream.

on:
  workflow_dispatch:
    inputs:
      angle_ref:
        description: ANGLE branch to build, e.g. chromium/8037 (empty = the one stable Chrome ships).
        required: false
        default: ""
      release:
        description: Publish a GitHub Release with the archives.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.angle_ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      commit: ${{ steps.resolve.outputs.commit }}
      position: ${{ steps.resolve.outputs.position }}
      chrome_version: ${{ steps.resolve.outputs.chrome_version }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: python3 .github/nucleus/angle_prebuilt.py resolve-ref --branch "$BRANCH"
        env:
          BRANCH: ${{ inputs.angle_ref }}

  build:
    name: ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            # Built natively so the smoke test can actually run the DLLs.
            runner: windows-11-arm
    env:
      # DEPOT_TOOLS_UPDATE stays on: the Windows bootstrap is what installs the
      # bundled git and CIPD client that gclient shells out to.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      ARCHIVE: angle-${{ needs.resolve.outputs.position }}-win32-${{ matrix.arch }}.zip
    steps:
      - name: Check out ANGLE at the release branch
        uses: actions/checkout@v5
        with:
          path: angle
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 1

      - name: Check out the harness
        uses: actions/checkout@v5
        with:
          path: harness
          sparse-checkout: .github/nucleus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          # Before the clone, not after: GitHub's Windows images default to
          # core.autocrlf=true, which rewrites depot_tools' POSIX wrappers and
          # its cipd_client_version.digests, leaving the CIPD bootstrap unable
          # to match any pinned hash and gclient unable to find git.
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig false

          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euo pipefail
          # First invocation downloads the bundled git, python and CIPD client.
          gclient version

      - name: Configure gclient
        shell: bash
        run: |
          set -euo pipefail
          # `managed: false` leaves the checkout above alone; gclient only
          # resolves DEPS. The custom vars drop the Dawn/OpenCL/trace corpora,
          # which are gigabytes we would never compile.
          cat > "$GITHUB_WORKSPACE/.gclient" <<'PY'
          solutions = [
            {
              "name": "angle",
              "url": "https://github.com/google/angle.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "checkout_angle_cl_deps": False,
                "checkout_angle_dawn_deps": False,
                "checkout_angle_internal": False,
                "checkout_angle_mesa": False,
                "checkout_angle_restricted_traces": False,
              },
            },
          ]
          PY

      - name: Sync ANGLE dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gclient sync --no-history --shallow --delete_unversioned_trees --reset --jobs 8; then
              exit 0
            fi
            echo "gclient sync attempt $attempt failed"
            sleep $((attempt * 30))
          done
          echo "::error::gclient sync failed three times"
          exit 1

      - name: Prepare the Windows toolchain
        shell: bash
        working-directory: angle
        run: python3 "$GITHUB_WORKSPACE/harness/.github/nucleus/angle_prebuilt.py" prepare-toolchain --source-root . --arch "${{ matrix.arch }}"

      - name: Generate GN args
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/.github/nucleus/angle_prebuilt.py" gn-args \
            --arch "${{ matrix.arch }}" \
            --output out/Release/args.gn \
            --json-output "$RUNNER_TEMP/gn-args.json"
          {
            echo '## args.gn (`${{ matrix.arch }}`)'
            echo '```gn'
            cat out/Release/args.gn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build libEGL and libGLESv2
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          gn gen out/Release
          autoninja -C out/Release libEGL libGLESv2

      - name: Package
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/.github/nucleus/angle_prebuilt.py" package \
            --build-dir out/Release \
            --source-root . \
            --staging "$RUNNER_TEMP/staging" \
            --output "$GITHUB_WORKSPACE/dist/$ARCHIVE" \
            --arch "${{ matrix.arch }}" \
            --branch "${{ needs.resolve.outputs.branch }}" \
            --commit "${{ needs.resolve.outputs.commit }}" \
            --chrome-version "${{ needs.resolve.outputs.chrome_version }}" \
            --gn-args-json "$RUNNER_TEMP/gn-args.json"

      - name: Verify
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/harness/.github/nucleus/angle_prebuilt.py" verify --archive "dist/$ARCHIVE" --arch "${{ matrix.arch }}"

      # Before the smoke test, not after: a failed smoke test is exactly when the
      # archive is worth having. The release job only runs once every build job
      # has succeeded, so nothing gets published on the strength of the upload.
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: angle-win32-${{ matrix.arch }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Locate the MSVC toolchain
        id: msvc
        shell: bash
        run: |
          set -euo pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          install="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          echo "vcvarsall=$install\\VC\\Auxiliary\\Build\\vcvarsall.bat" >> "$GITHUB_OUTPUT"

      - name: Smoke test the packaged DLLs
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.vcvarsall }}" ${{ matrix.arch }} || exit /b 1
          mkdir "%RUNNER_TEMP%\smoke" || exit /b 1
          rem Runs against the archive's own DLLs, in a directory holding nothing
          rem else, so anything the build dir happened to provide is missing here.
          tar -xf "dist\%ARCHIVE%" -C "%RUNNER_TEMP%\smoke" libEGL.dll libGLESv2.dll || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 ^
            /I angle\include ^
            harness\.github\nucleus\smoke.cpp ^
            /Fe:"%RUNNER_TEMP%\smoke\smoke.exe" ^
            /Fo:"%RUNNER_TEMP%\smoke\\" ^
            /link /LIBPATH:"angle\out\Release" libEGL.dll.lib libGLESv2.dll.lib || exit /b 1
          cd /d "%RUNNER_TEMP%\smoke" && smoke.exe || exit /b 1


  # One job for both destinations: the GitHub Release is the provenance record
  # (archives, checksums, build metadata, downloadable without a build tool) and
  # Maven Central is how Nucleus consumes it. They ship the same bytes, so they
  # are published together or not at all.
  release:
    name: release
    needs: [resolve, build]
    if: ${{ inputs.release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the harness
        uses: actions/checkout@v5

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: angle-win32-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.zip | tee SHA256SUMS.txt

      # Published bytes never change, because consumers pin their SHA-256 and
      # Maven Central is append-only. A merge-back advances chromium/NNNN without
      # changing NNNN, so a rebuild of the same branch takes the next free
      # revision suffix rather than overwriting what is already out there.
      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          base="angle-${{ needs.resolve.outputs.position }}"
          commit="${{ needs.resolve.outputs.commit }}"

          released_commit() {
            gh release view "$1" --json body --jq .body 2>/dev/null |
              grep -oE '[0-9a-f]{40}' | head -1 || true
          }

          tag="$base"
          revision=1
          while gh release view "$tag" >/dev/null 2>&1; do
            if [ "$(released_commit "$tag")" = "$commit" ]; then
              echo "::notice::$tag already publishes $commit"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=${tag#angle-}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            revision=$((revision + 1))
            tag="$base.$revision"
          done

          echo "Releasing as $tag"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#angle-}" >> "$GITHUB_OUTPUT"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the GitHub Release
        if: ${{ steps.tag.outputs.skip == 'false' }}
        working-directory: dist
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          notes="$(cat <<EOF
          Direct3D 11-only ANGLE runtime for the Nucleus Tao Windows backend.

          ## Use it

          The jar carries the libraries under \`nucleus/native/win32-{x64,aarch64}/\`,
          which is where \`NativeLibraryLoader\` looks for them, so the dependency is
          the whole integration.

          \`\`\`kotlin
          // Gradle (Kotlin DSL)
          implementation("dev.nucleusframework:nucleus.angle-natives:${{ steps.tag.outputs.version }}")
          \`\`\`

          \`\`\`groovy
          // Gradle (Groovy DSL)
          implementation 'dev.nucleusframework:nucleus.angle-natives:${{ steps.tag.outputs.version }}'
          \`\`\`

          \`\`\`xml
          <!-- Maven -->
          <dependency>
            <groupId>dev.nucleusframework</groupId>
            <artifactId>nucleus.angle-natives</artifactId>
            <version>${{ steps.tag.outputs.version }}</version>
          </dependency>
          \`\`\`

          ## Provenance

          | | |
          | --- | --- |
          | ANGLE branch | \`${{ needs.resolve.outputs.branch }}\` |
          | ANGLE commit | \`${{ needs.resolve.outputs.commit }}\` |
          | Chrome stable | ${{ needs.resolve.outputs.chrome_version || 'not the branch stable ships' }} |

          The Vulkan, desktop-GL/WGL, SwiftShader, WebGPU and OpenCL backends are
          disabled at the GN level; see \`angle-build.json\` in each archive for the
          full argument list and per-file SHA-256.

          \`\`\`
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF
          )"
          gh release create "$tag" *.zip SHA256SUMS.txt --title "$tag" --notes "$notes"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the natives for Maven
        id: stage
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if curl -fsSL -o /dev/null \
            "https://repo1.maven.org/maven2/dev/nucleusframework/nucleus.angle-natives/$version/"; then
            echo "::notice::$version is already on Maven Central, which is append-only"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          res="publishing/staging/nucleus/native"
          meta="publishing/staging/META-INF"
          mkdir -p "$res/win32-x64" "$res/win32-aarch64" "$meta/nucleus"

          # Resolved by glob rather than from the tag: a .N revision keeps the
          # archive names of the branch it rebuilds. win32-arm64 is the release's
          # name for the architecture, win32-aarch64 the directory name
          # NativeLibraryLoader resolves at runtime.
          x64_zip="$(echo dist/*-win32-x64.zip)"
          arm64_zip="$(echo dist/*-win32-arm64.zip)"
          unzip -j -o "$x64_zip" libEGL.dll libGLESv2.dll -d "$res/win32-x64"
          unzip -j -o "$arm64_zip" libEGL.dll libGLESv2.dll -d "$res/win32-aarch64"

          # Provenance travels with the binaries: the upstream licence, and the
          # manifest recording the ANGLE commit and full GN argument list.
          unzip -p "$x64_zip" LICENSE > "$meta/LICENSE.angle"
          unzip -p "$x64_zip" angle-build.json > "$meta/nucleus/angle-build-win32-x64.json"
          unzip -p "$arm64_zip" angle-build.json > "$meta/nucleus/angle-build-win32-arm64.json"

          find publishing/staging -type f -printf '%10s  %p\n'
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: ${{ steps.stage.outputs.skip == 'false' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: ${{ steps.stage.outputs.skip == 'false' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          # The exact release name, matching Nucleus' own wrapper. "9.4" is not
          # a published distribution and the action rejects it.
          gradle-version: "9.4.0"

      - name: Publish to Maven Central
        if: ${{ steps.stage.outputs.skip == 'false' }}
        working-directory: publishing
        run: |
          set -euo pipefail
          gradle --no-daemon publishAndReleaseToMavenCentral \
            -PangleVersion="${{ steps.tag.outputs.version }}" \
            -PangleCommit="${{ needs.resolve.outputs.commit }}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}

      - name: Summary
        run: |
          {
            echo "## ${{ steps.tag.outputs.tag || 'angle-' }}${{ steps.tag.outputs.version }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| GitHub Release | ${{ steps.tag.outputs.skip == 'true' && 'already published' || 'created' }} |"
            echo "| Maven Central | ${{ steps.stage.outputs.skip == 'true' && 'already published' || 'published' }} |"
            echo "| Coordinates | \`dev.nucleusframework:nucleus.angle-natives:${{ steps.tag.outputs.version }}\` |"
            echo "| ANGLE commit | \`${{ needs.resolve.outputs.commit }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
